<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gunjan's Hunt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    .pixel-font { font-family: 'Press Start 2P', cursive; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden select-none">

  <!-- Header / HUD -->
  <div class="w-full max-w-2xl flex justify-between items-center mb-3 px-2">
    <div>
      <div class="flex items-center space-x-2">
        <h1 class="pixel-font text-base sm:text-lg text-rose-400">👑 GUNJAN'S HUNT</h1>
        <span class="text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/40 px-2 py-0.5 rounded pixel-font">EVASIVE</span>
      </div>
      <p class="text-xs text-slate-400 mt-1">Control Gunjan with WASD or Arrow Keys</p>
    </div>
    <div class="flex items-center space-x-6">
      <div class="text-right">
        <div class="text-[10px] uppercase text-slate-400 pixel-font">Time Elapsed</div>
        <div id="timerDisplay" class="text-lg pixel-font text-amber-300">0.0s</div>
      </div>
    </div>
  </div>

  <!-- Game Canvas Container -->
  <div class="relative rounded-2xl overflow-hidden border-4 border-slate-800 shadow-2xl bg-slate-900">
    <canvas id="gameCanvas" width="640" height="480" class="block"></canvas>

    <!-- Start / Win Overlay -->
    <div id="screenOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
      <h2 id="overlayTitle" class="pixel-font text-xl sm:text-2xl text-rose-400 mb-3 leading-relaxed">GUNJAN'S HUNT</h2>
      <p id="overlaySubtitle" class="text-sm text-slate-300 max-w-sm mb-6 leading-relaxed font-medium">
        Aaditya is running from your kalesh, catch him as fast as you can!! 🏃💨
      </p>
      <button id="startBtn" class="pixel-font text-xs bg-rose-500 hover:bg-rose-600 active:scale-95 text-white px-6 py-3 rounded-xl transition duration-150 shadow-lg shadow-rose-500/30">
        START HUNTING 👑
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const overlay = document.getElementById('screenOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');
    const startBtn = document.getElementById('startBtn');
    const timerDisplay = document.getElementById('timerDisplay');

    // Photo Assets
    const aadityaImg = new Image();
    aadityaImg.src = 'face2.png';

    const gunjanImg = new Image();
    gunjanImg.src = 'face.png';

    // Game State
    let isPlaying = false;
    let startTime = 0;
    let elapsedTime = 0;
    let keys = {};

    // Entities
    const gunjan = {
      x: 100,
      y: 240,
      radius: 26,
      speed: 4.8,
      label: "👑 Gunjan (You)"
    };

    const aaditya = {
      x: 520,
      y: 240,
      radius: 25,
      baseSpeed: 4.0,
      speed: 4.0,
      vx: 0,
      vy: 0,
      changeTimer: 0,
      label: "Aaditya"
    };

    // Controls
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    startBtn.addEventListener('click', startGame);

    // Pick a random zig-zag angle away from Gunjan's current position
    function pickFleeDirection() {
      const baseAngle = Math.atan2(aaditya.y - gunjan.y, aaditya.x - gunjan.x);
      // Random angular deviation between -65° and +65° away from direct line
      const deviation = (Math.random() - 0.5) * (Math.PI * 0.72);
      const fleeAngle = baseAngle + deviation;

      aaditya.vx = Math.cos(fleeAngle) * aaditya.speed;
      aaditya.vy = Math.sin(fleeAngle) * aaditya.speed;
      // Change zig-zag trajectory every 20 to 45 frames (approx 0.3s - 0.75s)
      aaditya.changeTimer = Math.floor(Math.random() * 25) + 20;
    }

    function startGame() {
      isPlaying = true;
      startTime = Date.now();
      overlay.classList.add('hidden');

      // Reset Positions
      gunjan.x = 100;
      gunjan.y = canvas.height / 2;

      aaditya.x = canvas.width - 120;
      aaditya.y = canvas.height / 2;
      aaditya.speed = aaditya.baseSpeed;
      pickFleeDirection();

      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (!isPlaying) return;

      elapsedTime = (Date.now() - startTime) / 1000;
      timerDisplay.innerText = `${elapsedTime.toFixed(1)}s`;

      // Gunjan Movement
      if (keys['arrowup'] || keys['w']) gunjan.y -= gunjan.speed;
      if (keys['arrowdown'] || keys['s']) gunjan.y += gunjan.speed;
      if (keys['arrowleft'] || keys['a']) gunjan.x -= gunjan.speed;
      if (keys['arrowright'] || keys['d']) gunjan.x += gunjan.speed;

      gunjan.x = Math.max(gunjan.radius, Math.min(canvas.width - gunjan.radius, gunjan.x));
      gunjan.y = Math.max(gunjan.radius + 20, Math.min(canvas.height - gunjan.radius, gunjan.y));

      // Dynamic Speed Scaling
      aaditya.speed = aaditya.baseSpeed + (elapsedTime * 0.035);

      // Dynamic Random Flee updates
      aaditya.changeTimer--;
      if (aaditya.changeTimer <= 0) {
        pickFleeDirection();
      }

      // Wall avoidance push to prevent getting pinned against edges
      const margin = 70;
      if (aaditya.x < margin) aaditya.vx += 1.5;
      if (aaditya.x > canvas.width - margin) aaditya.vx -= 1.5;
      if (aaditya.y < margin) aaditya.vy += 1.5;
      if (aaditya.y > canvas.height - margin) aaditya.vy -= 1.5;

      aaditya.x += aaditya.vx;
      aaditya.y += aaditya.vy;

      // Strict boundaries
      const minX = aaditya.radius + 8;
      const maxX = canvas.width - aaditya.radius - 8;
      const minY = aaditya.radius + 24;
      const maxY = canvas.height - aaditya.radius - 8;

      if (aaditya.x <= minX) {
        aaditya.x = minX;
        aaditya.vx = Math.abs(aaditya.vx);
      } else if (aaditya.x >= maxX) {
        aaditya.x = maxX;
        aaditya.vx = -Math.abs(aaditya.vx);
      }

      if (aaditya.y <= minY) {
        aaditya.y = minY;
        aaditya.vy = Math.abs(aaditya.vy);
      } else if (aaditya.y >= maxY) {
        aaditya.y = maxY;
        aaditya.vy = -Math.abs(aaditya.vy);
      }

      // Catch Detection
      const dist = Math.hypot(aaditya.x - gunjan.x, aaditya.y - gunjan.y);
      if (dist < gunjan.radius + aaditya.radius - 5) {
        gameWon();
      }
    }

    function gameWon() {
      isPlaying = false;
      overlayTitle.innerText = "AADITYA CAUGHT!";
      overlaySubtitle.innerHTML = `You caught Aaditya in <strong class="text-amber-300 font-bold">${elapsedTime.toFixed(1)}s</strong>!<br><span class="text-xs text-rose-300 mt-3 block italic">"No matter where he runs, he's always yours ❤️"</span>`;
      startBtn.innerText = "HUNT AGAIN 🔄";
      overlay.classList.remove('hidden');
    }

    function drawCircularAvatar(img, x, y, radius, borderColor, fallbackColor) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.closePath();

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = borderColor;
      ctx.stroke();

      ctx.clip();

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, x - radius, y - radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = fallbackColor;
        ctx.fill();
      }
      ctx.restore();
    }

    function render() {
      // Clear Screen
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid Pattern
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Aaditya
      drawCircularAvatar(aadityaImg, aaditya.x, aaditya.y, aaditya.radius, '#38bdf8', '#0284c7');
      ctx.font = '600 12px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.textAlign = 'center';
      ctx.fillText(aaditya.label, aaditya.x, aaditya.y - aaditya.radius - 6);

      // Draw Gunjan (Player)
      drawCircularAvatar(gunjanImg, gunjan.x, gunjan.y, gunjan.radius, '#f43f5e', '#e11d48');
      ctx.fillStyle = '#fecdd3';
      ctx.fillText(gunjan.label, gunjan.x, gunjan.y - gunjan.radius - 6);
    }

    function gameLoop() {
      update();
      render();
      if (isPlaying) {
        requestAnimationFrame(gameLoop);
      }
    }

    render();
  </script>
</body>
</html>
